version: '3.9'

services:
  discovery-server:
    image: 'discovery-server:latest'
    container_name:
      'discovery-server-container'

  api-gateway:
    image: 'api-gateway:latest'
    container_name:
      'api-gateway-container'
    environment:
      - JWT_KEY=${JWT_KEY}
      - EUREKA_URI=http://discovery-server:8761/eureka
    ports:
      - "80:80"
    depends_on:
      - discovery-server

  order-service:
    image: 'order-service:latest'
    container_name:
      'order-service-container'
    depends_on:
      - order-db
      - discovery-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/${DB_ORDER_SCHEMA}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_KEY=${JWT_KEY}
      - EUREKA_URI=http://discovery-server:8761/eureka

  order-db:
    image: postgres
    container_name: 'order-db'
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_ORDER_SCHEMA}

  auth-service:
    image: 'auth-service:latest'
    container_name:
      'auth-service-container'
    depends_on:
      - auth-db
      - discovery-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/${DB_AUTH_SCHEMA}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_KEY=${JWT_KEY}
      - EUREKA_URI=http://discovery-server:8761/eureka

  auth-db:
    image: postgres
    container_name: 'auth-db'
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_AUTH_SCHEMA}

  user-service:
    image: 'user-service:latest'
    container_name: 'user-service-container'
    depends_on:
      - user-db
      - user-redis-cache
      - discovery-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-db:5432/${DB_USER_SCHEMA}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_HOST=user-redis-cache
      - JWT_KEY=${JWT_KEY}
      - EUREKA_URI=http://discovery-server:8761/eureka

  user-db:
    image: postgres
    container_name: user-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_USER_SCHEMA}

  user-redis-cache:
    image: 'redis:alpine'
    container_name: 'redis-cache'
    restart: always